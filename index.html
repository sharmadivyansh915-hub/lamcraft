<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LamCraft — Furniture Costing Studio</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg-window: #ececec;
    --bg-sidebar: rgba(246,246,248,0.86);
    --bg-content: #ffffff;
    --bg-card: #f7f7f8;
    --bg-hover: rgba(0,0,0,0.04);
    --bg-input: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #a1a1a6;
    --accent: #0071e3;
    --accent-soft: rgba(0,113,227,0.12);
    --border: #d8d8dc;
    --border-soft: #e6e6e9;
    --danger: #ff3b30;
    --success: #248a3d;
    --warn: #b8860b;
    --shadow: 0 20px 60px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
    --mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-window: #1c1c1e;
      --bg-sidebar: rgba(28,28,30,0.86);
      --bg-content: #242426;
      --bg-card: #2c2c2e;
      --bg-hover: rgba(255,255,255,0.06);
      --bg-input: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --text-tertiary: #6e6e73;
      --accent: #2f8fff;
      --accent-soft: rgba(47,143,255,0.18);
      --border: #3a3a3c;
      --border-soft: #333335;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg-window: #1c1c1e;
    --bg-sidebar: rgba(28,28,30,0.86);
    --bg-content: #242426;
    --bg-card: #2c2c2e;
    --bg-hover: rgba(255,255,255,0.06);
    --bg-input: #1c1c1e;
    --text: #f5f5f7;
    --text-secondary: #a1a1a6;
    --text-tertiary: #6e6e73;
    --accent: #2f8fff;
    --accent-soft: rgba(47,143,255,0.18);
    --border: #3a3a3c;
    --border-soft: #333335;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg-window);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 18px;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  }

  .window {
    width: 100%;
    max-width: 1320px;
    height: calc(100vh - 36px);
    min-height: 560px;
    background: var(--bg-content);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border-soft);
  }

  .titlebar {
    height: 46px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 14px;
    background: var(--bg-sidebar);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-soft);
    -webkit-user-select: none;
    user-select: none;
  }
  .traffic {
    display: flex;
    gap: 8px;
    flex: none;
  }
  .traffic span {
    width: 12px; height: 12px; border-radius: 50%;
    display: inline-block;
    position: relative;
    cursor: default;
  }
  .traffic .red { background: #ff5f57; }
  .traffic .yellow { background: #febc2e; }
  .traffic .green { background: #28c840; }
  .titlebar-title {
    flex: 1;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-right: 78px;
  }
  .titlebar-actions { display: flex; gap: 8px; flex: none; }
  .chip-btn {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    cursor: pointer;
  }
  .chip-btn:hover { background: var(--bg-hover); }

  .body {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .sidebar {
    width: 220px;
    flex: none;
    background: var(--bg-sidebar);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--border-soft);
    padding: 14px 10px;
    overflow-y: auto;
  }
  .sidebar-section { margin-bottom: 18px; }
  .sidebar-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    padding: 0 8px 6px;
    letter-spacing: 0.02em;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    margin-bottom: 1px;
  }
  .nav-item:hover { background: var(--bg-hover); }
  .nav-item.active { background: var(--accent); color: #fff; }
  .nav-item .ic { width: 18px; text-align: center; opacity: 0.85; }
  .project-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    gap: 6px;
  }
  .project-item:hover { background: var(--bg-hover); }
  .project-item.active { background: var(--accent); color: #fff; }
  .project-item .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-item .pcost { font-variant-numeric: tabular-nums; opacity: 0.75; font-size: 11px; flex: none; }
  .new-project-btn {
    width: 100%;
    margin-top: 4px;
    font-size: 12.5px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
  }
  .new-project-btn:hover { background: var(--accent-soft); }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 26px 34px 60px;
  }
  .content::-webkit-scrollbar { width: 10px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .page-header { margin-bottom: 22px; }
  .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .page-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .card h3 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card h3 .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    margin-right: 8px;
  }

  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 26px;
    text-align: center;
    cursor: pointer;
    background: var(--bg-input);
    transition: border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone .dz-icon { font-size: 26px; margin-bottom: 6px; }
  .dropzone .dz-main { font-size: 13px; font-weight: 500; }
  .dropzone .dz-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }

  .file-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-input);
    border: 1px solid var(--border-soft);
    border-radius: 9px;
    padding: 9px 12px;
    margin-top: 10px;
  }
  .thumb {
    border-radius: 6px;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .file-chip .thumb {
    width: 34px; height: 34px;
    font-size: 15px;
    flex: none;
  }
  .file-chip .meta { flex: 1; min-width: 0; }
  .file-chip .meta .fname { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .meta .fsub { font-size: 11px; color: var(--text-secondary); }
  .file-chip .remove { cursor: pointer; color: var(--text-tertiary); font-size: 16px; padding: 2px 4px; }
  .file-chip .remove:hover { color: var(--danger); }

  .btn {
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 13px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text);
    cursor: pointer;
  }
  .btn:hover { background: var(--bg-hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--danger); border-color: rgba(255,59,48,0.3); }
  .btn.small { padding: 4px 9px; font-size: 11.5px; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  input[type=text], input[type=number], select, textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 9px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text);
    outline: none;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input[type=range] { accent-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 11px; padding: 6px 8px; border-bottom: 1px solid var(--border-soft); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td input[type=number], td input[type=text], td select { width: 100%; padding: 5px 7px; font-size: 12.5px; }
  .col-tight { width: 1%; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }

  .estimate-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border-soft);
  }
  .estimate-row:last-of-type { border-bottom: none; }
  .estimate-row .label { color: var(--text-secondary); }
  .estimate-row .amt { font-variant-numeric: tabular-nums; }
  .estimate-total {
    display: flex;
    justify-content: space-between;
    padding-top: 12px;
    margin-top: 6px;
    border-top: 1.5px solid var(--border);
    font-size: 18px;
    font-weight: 700;
  }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input[type=text] { flex: 1; min-width: 160px; }
  .filter-chip {
    font-size: 12px; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-input); cursor: pointer; color: var(--text-secondary);
  }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .lib-card {
    background: var(--bg-input); border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 10px; cursor: default;
  }
  .lib-card .lib-thumb {
    width: 100%; height: 84px; border-radius: 7px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: 22px; overflow: hidden; margin-bottom: 8px;
  }
  .lib-card .lib-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .lib-card .lib-name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-card .lib-meta { font-size: 10.5px; color: var(--text-secondary); margin-top: 2px; }

  .empty-state {
    text-align: center; padding: 50px 20px; color: var(--text-secondary);
  }
  .empty-state .ic { font-size: 32px; margin-bottom: 8px; }
  .empty-state .title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .empty-state .sub { font-size: 12.5px; }

  .field-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11.5px; color: var(--text-secondary); font-weight: 500; }

  code, pre { font-family: var(--mono); }
  .code-pane {
    background: #1e1e1e;
    color: #d4d4d4;
    border-radius: 10px;
    padding: 16px;
    font-size: 11.5px;
    line-height: 1.6;
    overflow: auto;
    max-height: 62vh;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg-content);
    padding: 9px 16px;
    border-radius: 9px;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .badge {
    font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 5px;
    background: var(--accent-soft); color: var(--accent); text-transform: uppercase; letter-spacing: 0.02em;
  }

  ::placeholder { color: var(--text-tertiary); }

  @media (max-width: 760px) {
    body { padding: 0; }
    .window { height: 100vh; border-radius: 0; max-width: 100%; }
    .sidebar { position: fixed; z-index: 50; left: 0; top: 46px; bottom: 0; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); }
    .content { padding: 18px; }
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .modal-card {
    background: var(--bg-content);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 620px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 14px;
    font-weight: 600;
    flex: none;
  }
  .modal-close { cursor: pointer; color: var(--text-tertiary); font-size: 16px; padding: 2px 6px; }
  .modal-close:hover { color: var(--danger); }
  .modal-body { padding: 16px 18px; overflow-y: auto; }
  .modal-pick { cursor: pointer; transition: border-color .12s, transform .12s; }
  .modal-pick:hover { border-color: var(--accent); transform: translateY(-1px); }
</style>
</head>
<body>

<div class="window" id="window">
  <div class="titlebar">
    <div class="traffic">
      <span class="red" title="Close (resets nothing — just cosmetic)"></span>
      <span class="yellow" title="Minimize (cosmetic)"></span>
      <span class="green" title="Zoom (cosmetic)"></span>
    </div>
    <button class="chip-btn" id="sidebarToggle" style="display:none;">☰</button>
    <div class="titlebar-title" id="titlebarTitle">LamCraft</div>
    <div class="titlebar-actions">
      <button class="chip-btn" id="themeToggle">🌗 Theme</button>
    </div>
  </div>

  <div class="body">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">LAMCRAFT</div>
        <div class="nav-item" data-page="dashboard"><span class="ic">🏠</span>Dashboard</div>
        <div class="nav-item" data-page="library"><span class="ic">🗂️</span>File Library</div>
        <div class="nav-item" data-page="settings"><span class="ic">⚙️</span>Rates &amp; Settings</div>
        <div class="nav-item" data-page="code"><span class="ic">&lt;/&gt;</span>View Source</div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">PROJECTS</div>
        <div id="projectList"></div>
        <button class="new-project-btn" id="newProjectBtn">+ New Project</button>
      </div>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="cadFileInput" accept=".c4d" style="display:none;">
<input type="file" id="laminateFileInput" accept=".jpg,.jpeg,.png,.pdf" multiple style="display:none;">
<input type="file" id="libLaminateFileInput" accept=".jpg,.jpeg,.png,.pdf" multiple style="display:none;">

<script>
  // Snapshot the static markup now, before any JS below mutates #content,
  // so the in-app "View Source" pane reflects the authored page, not runtime state.
  window.__LAMCRAFT_SOURCE__ = document.documentElement.outerHTML;
</script>

<script>
(function(){
  "use strict";

  /* ---------- constants ---------- */
  var SHEET_SQFT = 8 * 4; // 32 sqft per 8ft x 4ft sheet
  var STORAGE_KEY = "lamcraft_state_v1";
  var uid = function(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); };
  var fmtMoney = function(n){ return "₹" + (Math.round((n||0) * 100)/100).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); };
  var fmtDate = function(ts){ try { return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); } catch(e){ return ""; } };
  var esc = function(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };

  /* ---------- default state ---------- */
  function defaultState(){
    return {
      settings: {
        sheetWidthFt: 8,
        sheetHeightFt: 4,
        adhesiveKgPerSheetPerSide: 1,
        adhesiveCostPerKg: 260,
        defaultLaminateCostPerSheet: 850,
        defaultMarkupPercent: 15,
        currency: "₹"
      },
      library: {
        cadFiles: [],
        laminates: []
      },
      projects: {},
      activeProjectId: null
    };
  }

  var state = loadState();

  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var d = defaultState();
      return {
        settings: Object.assign({}, d.settings, parsed.settings || {}),
        library: {
          cadFiles: (parsed.library && parsed.library.cadFiles) || [],
          laminates: (parsed.library && parsed.library.laminates) || []
        },
        projects: parsed.projects || {},
        activeProjectId: parsed.activeProjectId || null
      };
    } catch(e){
      console.error("LamCraft: failed to load state", e);
      return defaultState();
    }
  }

  function saveState(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e){
      console.error("LamCraft: failed to save state", e);
      showToast("Couldn't save — storage may be full or unavailable");
    }
  }

  /* ---------- project helpers ---------- */
  function newProject(){
    var id = uid();
    state.projects[id] = {
      id: id,
      name: "Untitled Project " + (Object.keys(state.projects).length + 1),
      createdAt: Date.now(),
      updatedAt: Date.now(),
      cadFileId: null,
      laminateLines: [],
      laborFlat: 0,
      markupPercent: state.settings.defaultMarkupPercent,
      notes: ""
    };
    state.activeProjectId = id;
    saveState();
    return id;
  }

  function activeProject(){
    return state.activeProjectId ? state.projects[state.activeProjectId] : null;
  }

  function touchProject(p){ p.updatedAt = Date.now(); }

  function projectEstimate(p){
    var laminateCost = 0, sheetsTotal = 0, adhesiveKg = 0;
    (p.laminateLines || []).forEach(function(line){
      var sheets = (line.areaSqft || 0) / SHEET_SQFT;
      sheetsTotal += sheets;
      laminateCost += sheets * (line.costPerSheet || 0);
      adhesiveKg += sheets * (line.sides || 1) * state.settings.adhesiveKgPerSheetPerSide;
    });
    var adhesiveCost = adhesiveKg * state.settings.adhesiveCostPerKg;
    var subtotal = laminateCost + adhesiveCost + (p.laborFlat || 0);
    var markup = subtotal * ((p.markupPercent || 0) / 100);
    var total = subtotal + markup;
    return { sheetsTotal: sheetsTotal, laminateCost: laminateCost, adhesiveKg: adhesiveKg, adhesiveCost: adhesiveCost, laborFlat: p.laborFlat||0, subtotal: subtotal, markup: markup, total: total };
  }

  /* ---------- file reading ---------- */
  function readFileAsDataURL(file, cb){
    var reader = new FileReader();
    reader.onload = function(){ cb(reader.result); };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  function fileKind(name){
    var ext = (name.split(".").pop() || "").toLowerCase();
    if (ext === "pdf") return "pdf";
    if (["jpg","jpeg","png"].indexOf(ext) > -1) return "image";
    if (ext === "c4d") return "c4d";
    return "file";
  }

  function fmtSize(bytes){
    if (bytes == null) return "";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + " KB";
    return (bytes/1024/1024).toFixed(1) + " MB";
  }

  /* ---------- UI: routing ---------- */
  var currentPage = "dashboard";
  var libraryFilter = "all";
  var librarySearch = "";
  var librarySort = "date";

  function go(page){
    currentPage = page;
    if (page !== "dashboard" && page !== "project") {
      // deselect nothing; just render
    }
    render();
  }

  function selectProject(id){
    state.activeProjectId = id;
    currentPage = "project";
    saveState();
    render();
  }

  /* ---------- rendering ---------- */
  var contentEl = document.getElementById("content");
  var projectListEl = document.getElementById("projectList");
  var titleEl = document.getElementById("titlebarTitle");

  function render(){
    renderSidebarNav();
    renderProjectList();
    if (currentPage === "project" && activeProject()) {
      titleEl.textContent = activeProject().name;
      contentEl.innerHTML = projectPageHTML(activeProject());
      bindProjectPage();
    } else if (currentPage === "library") {
      titleEl.textContent = "File Library";
      contentEl.innerHTML = libraryPageHTML();
      bindLibraryPage();
    } else if (currentPage === "settings") {
      titleEl.textContent = "Rates & Settings";
      contentEl.innerHTML = settingsPageHTML();
      bindSettingsPage();
    } else if (currentPage === "code") {
      titleEl.textContent = "View Source";
      contentEl.innerHTML = codePageHTML();
      bindCodePage();
    } else {
      currentPage = "dashboard";
      titleEl.textContent = "LamCraft";
      contentEl.innerHTML = dashboardPageHTML();
      bindDashboardPage();
    }
  }

  function renderSidebarNav(){
    document.querySelectorAll(".nav-item").forEach(function(el){
      var p = el.getAttribute("data-page");
      el.classList.toggle("active", p === currentPage);
    });
  }

  function renderProjectList(){
    var ids = Object.keys(state.projects).sort(function(a,b){ return state.projects[b].updatedAt - state.projects[a].updatedAt; });

      projectListEl.innerHTML = '<div style="font-size:11.5px;color:var(--text-tertiary);padding:4px 8px;">No projects yet</div>';

    projectListEl.innerHTML = ids.map(function(id){
      var p = state.projects[id];
      var est = projectEstimate(p);
      var active = (currentPage === "project" && state.activeProjectId === id);
      return '<div class="project-item ' + (active ? "active" : "") + '" data-id="' + id + '">' +
        '<span class="pname">' + esc(p.name) + '</span>' +
        '<span class="pcost">' + fmtMoney(est.total) + '</span>' +

      el.addEventListener("click", function(){ selectProject(el.getAttribute("data-id")); });

  /* ---------- PROJECT PAGE ---------- */

  function bindProjectPage(){
    var p = activeProject();
    if (!p) return;

    var cadDz = document.getElementById("cadDropzone");
    if (cadDz) {
      cadDz.addEventListener("click", function(){ document.getElementById("cadFileInput").click(); });
      ["dragover","dragenter"].forEach(function(ev){ cadDz.addEventListener(ev, function(e){ e.preventDefault(); cadDz.classList.add("drag"); }); });
      ["dragleave","drop"].forEach(function(ev){ cadDz.addEventListener(ev, function(e){ e.preventDefault(); cadDz.classList.remove("drag"); }); });
      cadDz.addEventListener("drop", function(e){
        var f = e.dataTransfer.files[0];
        if (f) handleCadFile(f);
      });
    }
    var removeCad = document.querySelector("[data-remove-cad]");
    if (removeCad) removeCad.addEventListener("click", function(){ p.cadFileId = null; touchProject(p); saveState(); render(); });

    var uploadBtn = document.getElementById("uploadLaminateBtn");
    if (uploadBtn) uploadBtn.addEventListener("click", function(){ document.getElementById("laminateFileInput").click(); });
    var pickBtn = document.getElementById("pickLibraryBtn");
    if (pickBtn) pickBtn.addEventListener("click", openLibraryPicker);

    document.querySelectorAll("[data-remove-line]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-remove-line");
        p.laminateLines = p.laminateLines.filter(function(l){ return l.id !== id; });
        touchProject(p); saveState(); render();
      });
    });

    document.querySelectorAll("tr[data-line]").forEach(function(row){
      var id = row.getAttribute("data-line");
      var line = p.laminateLines.find(function(l){ return l.id === id; });
      if (!line) return;
      row.querySelector(".ln-sides").addEventListener("change", function(e){ line.sides = parseInt(e.target.value,10); touchProject(p); saveState(); updateProjectNumbers(p); });
      row.querySelector(".ln-area").addEventListener("input", function(e){ line.areaSqft = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });
      row.querySelector(".ln-cost").addEventListener("input", function(e){ line.costPerSheet = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });
    });

    var nameInput = document.getElementById("projName");
    if (nameInput) nameInput.addEventListener("input", function(e){ p.name = e.target.value || "Untitled Project"; touchProject(p); saveState(); renderProjectList(); titleEl.textContent = p.name; });

    var laborInput = document.getElementById("laborFlat");
    if (laborInput) laborInput.addEventListener("input", function(e){ p.laborFlat = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });
    var markupInput = document.getElementById("markupPct");
    if (markupInput) markupInput.addEventListener("input", function(e){ p.markupPercent = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });

    document.getElementById("saveProjectBtn").addEventListener("click", function(){ touchProject(p); saveState(); showToast("Project saved"); renderProjectList(); });
    document.getElementById("deleteProjectBtn").addEventListener("click", function(){
      if (!confirm('Delete "' + p.name + '"? This cannot be undone.')) return;
      delete state.projects[p.id];
      state.activeProjectId = null;
      currentPage = "dashboard";
      saveState();
      render();
    });
  }

  // Update only the computed numbers in place, without rebuilding the DOM —
  // rebuilding on every keystroke destroyed focus and closed the on-screen keyboard.
  function updateProjectNumbers(p){
    var est = projectEstimate(p);

    document.querySelectorAll("tr[data-line]").forEach(function(row){
      var id = row.getAttribute("data-line");
      var line = p.laminateLines.find(function(l){ return l.id === id; });
      if (!line) return;
      var sheets = (line.areaSqft || 0) / SHEET_SQFT;
      var cost = sheets * (line.costPerSheet || 0);
      var sheetsCell = row.querySelector(".ln-sheets-cell");
      var totalCell = row.querySelector(".ln-total-cell");
      if (sheetsCell) sheetsCell.textContent = sheets.toFixed(2);
      if (totalCell) totalCell.textContent = fmtMoney(cost);
    });

    setText("est-sheets", est.sheetsTotal.toFixed(2));
    setText("est-adhkg", est.adhesiveKg.toFixed(2) + " kg");
    setText("est-adhcost", fmtMoney(est.adhesiveCost));

    setText("fe-laminate", fmtMoney(est.laminateCost));
    setText("fe-adhesive", fmtMoney(est.adhesiveCost));
    setText("fe-labor", fmtMoney(est.laborFlat));
    setText("fe-subtotal", fmtMoney(est.subtotal));
    setText("fe-markup-label", "Markup (" + (p.markupPercent || 0) + "%)");
    setText("fe-markup", fmtMoney(est.markup));
    setText("fe-total", fmtMoney(est.total));

    renderProjectList();
  }

  function setText(id, text){
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function handleCadFile(file){
    var p = activeProject();
    if (!p) return;
    var entry = { id: uid(), name: file.name, size: file.size, uploadedAt: Date.now(), kind: "c4d" };
    state.library.cadFiles.push(entry);
    p.cadFileId = entry.id;
    touchProject(p);
    saveState();
    showToast("CAD file added");
    render();
  }

  function handleLaminateFiles(fileList, opts){
    opts = opts || {};
    var p = activeProject();
    if (!p) return;
    var files = Array.prototype.slice.call(fileList);
    var remaining = files.length;
    if (!remaining) return;
    files.forEach(function(file){
      var kind = fileKind(file.name);
      var finalize = function(dataUrl){
        var libEntry = { id: uid(), name: file.name, kind: kind, size: file.size, uploadedAt: Date.now(), costPerSheet: state.settings.defaultLaminateCostPerSheet, thumbnail: (kind === "image") ? dataUrl : null };
        state.library.laminates.push(libEntry);
        p.laminateLines.push({ id: uid(), libraryLaminateId: libEntry.id, name: file.name, costPerSheet: libEntry.costPerSheet, areaSqft: SHEET_SQFT, sides: 1, thumbnail: libEntry.thumbnail });
        remaining--;
        if (remaining === 0) { touchProject(p); saveState(); showToast("Laminate added"); render(); }
      };
      if (kind === "image") { readFileAsDataURL(file, finalize); }
      else { finalize(null); }
    });
  }

  function openLibraryPicker(){
    var p = activeProject();
    if (!p) return;
    if (!state.library.laminates.length) { showToast("Library is empty — upload a laminate first"); return; }

    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal-card">' +
        '<div class="modal-header"><span>Choose a laminate</span><span class="modal-close" id="modalClose">✕</span></div>' +
        '<div class="modal-body"><div class="lib-grid" id="modalGrid"></div></div>' +
      '</div>';
    document.body.appendChild(overlay);

    function closeModal(){ overlay.remove(); }
    overlay.addEventListener("click", function(e){ if (e.target === overlay) closeModal(); });
    document.getElementById("modalClose").addEventListener("click", closeModal);

    var grid = document.getElementById("modalGrid");
    grid.innerHTML = state.library.laminates.map(function(l){
      var thumb = l.thumbnail ? '<img src="' + l.thumbnail + '">' : (l.kind === "pdf" ? "📄" : "🎨");
      return '<div class="lib-card modal-pick" data-pick="' + l.id + '">' +
        '<div class="lib-thumb">' + thumb + '</div>' +
        '<div class="lib-name">' + esc(l.name) + '</div>' +
        '<div class="lib-meta">' + fmtMoney(l.costPerSheet) + '/sheet</div>' +
        '</div>';
    }).join("");
    grid.querySelectorAll("[data-pick]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-pick");
        var lam = state.library.laminates.find(function(f){ return f.id === id; });
        if (!lam) return;
        p.laminateLines.push({ id: uid(), libraryLaminateId: lam.id, name: lam.name, costPerSheet: lam.costPerSheet, areaSqft: SHEET_SQFT, sides: 1, thumbnail: lam.thumbnail });
        touchProject(p); saveState(); showToast("Added from library");
        closeModal();
        render();
      });
    });
  }

  /* ---------- LIBRARY PAGE ---------- */
  function libraryFilteredSorted(){
    var all = state.library.cadFiles.map(function(f){ return Object.assign({}, f, {type:"cad"}); })
      .concat(state.library.laminates.map(function(f){ return Object.assign({}, f, {type:"laminate"}); }));

    var filtered = all.filter(function(f){
      if (libraryFilter === "cad" && f.type !== "cad") return false;
      if (libraryFilter === "laminate" && f.type !== "laminate") return false;
      if (librarySearch && f.name.toLowerCase().indexOf(librarySearch.toLowerCase()) === -1) return false;
      return true;
    });

    filtered.sort(function(a,b){
      if (librarySort === "name") return a.name.localeCompare(b.name);
      if (librarySort === "cost") return (b.costPerSheet||0) - (a.costPerSheet||0);
      return b.uploadedAt - a.uploadedAt; // date
    });
    return filtered;
  }

  function libraryGridHTML(){
    var filtered = libraryFilteredSorted();
    var cards = filtered.map(function(f){
      var thumb = f.type === "cad" ? "🧊" : (f.thumbnail ? '<img src="' + f.thumbnail + '">' : (f.kind === "pdf" ? "📄" : "🎨"));
      var meta = f.type === "cad" ? fmtSize(f.size) + " · " + fmtDate(f.uploadedAt) : fmtMoney(f.costPerSheet) + "/sheet · " + fmtDate(f.uploadedAt);
      return '<div class="lib-card">' +
        '<div class="lib-thumb">' + thumb + '</div>' +
        '<div class="lib-name">' + esc(f.name) + ' <span class="badge">' + f.type + '</span></div>' +
        '<div class="lib-meta">' + meta + '</div>' +
        (f.type === "laminate" ? '<div style="margin-top:6px;"><input type="number" class="lib-cost-input" data-id="' + f.id + '" value="' + (f.costPerSheet||0) + '" style="width:100%;font-size:11.5px;padding:4px 6px;"></div>' : '') +
        '<div style="margin-top:6px;"><span class="remove" data-lib-remove="' + f.id + '" data-lib-type="' + f.type + '" style="font-size:11px;">Remove</span></div>' +
        '</div>';
    }).join("");
    return filtered.length ? '<div class="lib-grid">' + cards + '</div>' :
      '<div class="empty-state"><div class="ic">🗂️</div><div class="title">No files match</div><div class="sub">Try a different search or upload something new.</div></div>';
  }

  function libraryPageHTML(){
    return '' +
      '<div class="page-header"><div class="page-title">File Library</div><div class="page-sub">Every CAD file and laminate swatch uploaded across all projects, in one place.</div></div>' +
      '<div class="toolbar">' +
        '<input type="text" id="librarySearchInput" placeholder="Search files…" value="' + esc(librarySearch) + '">' +
        '<div class="filter-chip ' + (libraryFilter==="all"?"active":"") + '" data-filter="all">All</div>' +
        '<div class="filter-chip ' + (libraryFilter==="cad"?"active":"") + '" data-filter="cad">CAD</div>' +
        '<div class="filter-chip ' + (libraryFilter==="laminate"?"active":"") + '" data-filter="laminate">Laminates</div>' +
        '<select id="librarySortSelect" style="margin-left:auto;">' +
          '<option value="date"' + (librarySort==="date"?" selected":"") + '>Sort: Newest</option>' +
          '<option value="name"' + (librarySort==="name"?" selected":"") + '>Sort: Name</option>' +
          '<option value="cost"' + (librarySort==="cost"?" selected":"") + '>Sort: Cost</option>' +

        '<button class="btn small" id="libUploadBtn">📤 Upload laminate</button>' +
      '</div>' +
      '<div id="libraryGrid">' + libraryGridHTML() + '</div>';
  }

  function refreshLibraryGrid(){
    var el = document.getElementById("libraryGrid");
    if (!el) return;
    el.innerHTML = libraryGridHTML();
    bindLibraryGridItems();
  }

  function bindLibraryGridItems(){
    document.querySelectorAll("[data-lib-remove]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-lib-remove");
        var type = el.getAttribute("data-lib-type");
        if (!confirm("Remove this file from the library? Projects referencing it will keep their own copy of the cost/name.")) return;
        if (type === "cad") state.library.cadFiles = state.library.cadFiles.filter(function(f){ return f.id !== id; });
        else state.library.laminates = state.library.laminates.filter(function(f){ return f.id !== id; });
        saveState(); refreshLibraryGrid();
      });
    });
    document.querySelectorAll(".lib-cost-input").forEach(function(el){
      el.addEventListener("input", function(e){
        var id = el.getAttribute("data-id");
        var lam = state.library.laminates.find(function(f){ return f.id === id; });
        if (lam) { lam.costPerSheet = parseFloat(e.target.value)||0; saveState(); }
      });
    });
  }

  function bindLibraryPage(){
    var search = document.getElementById("librarySearchInput");
    search.addEventListener("input", function(e){ librarySearch = e.target.value; refreshLibraryGrid(); });
    document.querySelectorAll(".filter-chip").forEach(function(el){
      el.addEventListener("click", function(){
        libraryFilter = el.getAttribute("data-filter");
        document.querySelectorAll(".filter-chip").forEach(function(c){ c.classList.toggle("active", c.getAttribute("data-filter") === libraryFilter); });
        refreshLibraryGrid();
      });
    });
    document.getElementById("librarySortSelect").addEventListener("change", function(e){ librarySort = e.target.value; refreshLibraryGrid(); });
    document.getElementById("libUploadBtn").addEventListener("click", function(){ document.getElementById("libLaminateFileInput").click(); });
    bindLibraryGridItems();
  }

  /* ---------- SETTINGS PAGE ---------- */
  function settingsPageHTML(){
    var s = state.settings;
    return '' +
      '<div class="page-header"><div class="page-title">Rates &amp; Settings</div><div class="page-sub">These defaults apply across every project. Existing project line items keep whatever cost they were given at the time.</div></div>' +
      '<div class="card">' +
        '<h3>Sheet size</h3>' +
        '<div class="field-row">' +
          '<div class="field"><label>Width (ft)</label><input type="number" id="s-sheetW" value="' + s.sheetWidthFt + '" step="0.5" min="0.5"></div>' +
          '<div class="field"><label>Height (ft)</label><input type="number" id="s-sheetH" value="' + s.sheetHeightFt + '" step="0.5" min="0.5"></div>' +
          '<div class="field"><label>Sheet area</label><div style="padding-top:7px;font-size:13px;">' + (s.sheetWidthFt*s.sheetHeightFt) + ' sqft</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>Adhesive</h3>' +
        '<div class="page-sub" style="margin-bottom:10px;">1 sheet (8ft × 4ft = 32 sqft) needs this much adhesive per side laminated.</div>' +
        '<div class="field-row">' +
          '<div class="field"><label>kg per sheet, per side</label><input type="number" id="s-adhKg" value="' + s.adhesiveKgPerSheetPerSide + '" step="0.05" min="0"></div>' +
          '<div class="field"><label>Cost per kg</label><input type="number" id="s-adhCost" value="' + s.adhesiveCostPerKg + '" step="1" min="0"></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>Defaults</h3>' +
        '<div class="field-row">' +
          '<div class="field"><label>Default laminate cost / sheet</label><input type="number" id="s-defLamCost" value="' + s.defaultLaminateCostPerSheet + '" step="10" min="0"></div>' +
          '<div class="field"><label>Default markup %</label><input type="number" id="s-defMarkup" value="' + s.defaultMarkupPercent + '" step="0.5" min="0"></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>Data</h3>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          '<button class="btn" id="exportBtn">⬇️ Export all data (JSON)</button>' +
          '<button class="btn danger" id="resetBtn">Reset everything</button>' +
        '</div>' +
      '</div>';
  }

  function bindSettingsPage(){
    var s = state.settings;
    function bindNum(id, key, onEach){
      document.getElementById(id).addEventListener("input", function(e){
        s[key] = parseFloat(e.target.value) || 0;
        saveState();
        if (onEach) onEach();
      });
    }
    bindNum("s-sheetW", "sheetWidthFt");
    bindNum("s-sheetH", "sheetHeightFt");
    bindNum("s-adhKg", "adhesiveKgPerSheetPerSide");
    bindNum("s-adhCost", "adhesiveCostPerKg");
    bindNum("s-defLamCost", "defaultLaminateCostPerSheet");
    bindNum("s-defMarkup", "defaultMarkupPercent");

    document.getElementById("exportBtn").addEventListener("click", function(){
      try {
        var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "lamcraft-export.json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("Exported");
      } catch(e){ showToast("Export failed in this environment"); }
    });
    document.getElementById("resetBtn").addEventListener("click", function(){
      if (!confirm("Erase all projects, library files and settings? This cannot be undone.")) return;
      state = defaultState();
      saveState();
      currentPage = "dashboard";
      render();
    });
  }

  /* ---------- CODE PAGE ---------- */
  function codePageHTML(){
    return '' +
      '<div class="page-header"><div class="page-title">View Source</div><div class="page-sub">This entire app is a single self-contained HTML file — no build step, no server. Copy it and it runs anywhere.</div></div>' +
      '<div class="card"><div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><button class="btn small" id="copySourceBtn">📋 Copy source</button></div>' +
      '<div class="code-pane" id="codePane">' + esc(window.__LAMCRAFT_SOURCE__ || "Source unavailable") + '</div></div>';
  }

  function bindCodePage(){
    document.getElementById("copySourceBtn").addEventListener("click", function(){
      var text = window.__LAMCRAFT_SOURCE__ || "";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function(){ showToast("Source copied"); }).catch(function(){ showToast("Copy failed"); });
      } else {
        showToast("Clipboard unavailable in this environment");
      }
    });
  }

  /* ---------- toast ---------- */
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  /* ---------- global bindings ---------- */
  document.querySelectorAll(".nav-item").forEach(function(el){
    el.addEventListener("click", function(){ go(el.getAttribute("data-page")); });
  });
  document.getElementById("newProjectBtn").addEventListener("click", function(){
    var id = newProject();
    currentPage = "project";
    render();
  });

  document.getElementById("cadFileInput").addEventListener("change", function(e){
    if (e.target.files[0]) handleCadFile(e.target.files[0]);
    e.target.value = "";
  });
  document.getElementById("laminateFileInput").addEventListener("change", function(e){
    handleLaminateFiles(e.target.files);
    e.target.value = "";
  });
  document.getElementById("libLaminateFileInput").addEventListener("change", function(e){
    var files = Array.prototype.slice.call(e.target.files);
    var remaining = files.length;
    if (!remaining) return;
    files.forEach(function(file){
      var kind = fileKind(file.name);
      var finalize = function(dataUrl){
        state.library.laminates.push({ id: uid(), name: file.name, kind: kind, size: file.size, uploadedAt: Date.now(), costPerSheet: state.settings.defaultLaminateCostPerSheet, thumbnail: (kind==="image")?dataUrl:null });
        remaining--;
        if (remaining === 0) { saveState(); showToast("Added to library"); render(); }
      };
      if (kind === "image") readFileAsDataURL(file, finalize); else finalize(null);
    });
    e.target.value = "";
  });

  /* theme toggle: light -> dark -> auto(system) */
  var themeOrder = ["auto","light","dark"];
  var themeIdx = 0;
  document.getElementById("themeToggle").addEventListener("click", function(){
    themeIdx = (themeIdx + 1) % themeOrder.length;
    var t = themeOrder[themeIdx];
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    showToast("Theme: " + t);
  });

  /* mobile sidebar toggle */
  function checkMobile(){
    var isMobile = window.innerWidth <= 760;
    document.getElementById("sidebarToggle").style.display = isMobile ? "inline-block" : "none";
  }
  window.addEventListener("resize", checkMobile);
  checkMobile();
  document.getElementById("sidebarToggle").addEventListener("click", function(){
    document.getElementById("sidebar").classList.toggle("open");
  });

  /* seed a starter project on first run so the app isn't empty */
  if (!Object.keys(state.projects).length) {
    var id = newProject();
    state.projects[id].name = "Sample — Oak Console Table";
  }
  if (!state.activeProjectId || !state.projects[state.activeProjectId]) {
    state.activeProjectId = Object.keys(state.projects)[0];
  }
  currentPage = "project";
  saveState();
  render();

})();
</script>

</body>
</html>
