<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LamCraft — Furniture Costing Studio</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg-window: #ececec;
    --bg-sidebar: rgba(246,246,248,0.86);
    --bg-content: #ffffff;
    --bg-card: #f7f7f8;
    --bg-hover: rgba(0,0,0,0.04);
    --bg-input: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #a1a1a6;
    --accent: #0071e3;
    --accent-soft: rgba(0,113,227,0.12);
    --border: #d8d8dc;
    --border-soft: #e6e6e9;
    --danger: #ff3b30;
    --success: #248a3d;
    --warn: #b8860b;
    --shadow: 0 20px 60px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
    --mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-window: #1c1c1e; --bg-sidebar: rgba(28,28,30,0.86); --bg-content: #242426; --bg-card: #2c2c2e;
      --bg-hover: rgba(255,255,255,0.06); --bg-input: #1c1c1e; --text: #f5f5f7; --text-secondary: #a1a1a6;
      --text-tertiary: #6e6e73; --accent: #2f8fff; --accent-soft: rgba(47,143,255,0.18); --border: #3a3a3c; --border-soft: #333335;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg-window: #1c1c1e; --bg-sidebar: rgba(28,28,30,0.86); --bg-content: #242426; --bg-card: #2c2c2e;
    --bg-hover: rgba(255,255,255,0.06); --bg-input: #1c1c1e; --text: #f5f5f7; --text-secondary: #a1a1a6;
    --text-tertiary: #6e6e73; --accent: #2f8fff; --accent-soft: rgba(47,143,255,0.18); --border: #3a3a3c; --border-soft: #333335;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg-window); color: var(--text); -webkit-font-smoothing: antialiased;
    display: flex; align-items: stretch; justify-content: center;
    padding: 18px; padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  }

  .window {
    width: 100%; max-width: 1320px; height: calc(100vh - 36px); min-height: 560px;
    background: var(--bg-content); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
    display: flex; flex-direction: column; border: 1px solid var(--border-soft);
  }

  .titlebar {
    height: 46px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 14px;
    background: var(--bg-sidebar); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-soft); -webkit-user-select: none; user-select: none;
  }
  .traffic { display: flex; gap: 8px; flex: none; }
  .traffic span {
    width: 12px; height: 12px; border-radius: 50%; display: inline-flex; align-items:center; justify-content:center;
    cursor: pointer; font-size: 8px; color: rgba(0,0,0,0.45); line-height:1;
  }
  .traffic .red { background: #ff5f57; } .traffic .yellow { background: #febc2e; } .traffic .green { background: #28c840; }
  .titlebar-title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-right: 78px; }
  .titlebar-actions { display: flex; gap: 8px; flex: none; }
  .chip-btn { font-size: 12px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); cursor: pointer; }
  .chip-btn:hover { background: var(--bg-hover); }

  .body { flex: 1; display: flex; min-height: 0; }

  .sidebar {
    width: 220px; flex: none; background: var(--bg-sidebar); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--border-soft); padding: 14px 10px; overflow-y: auto;
    transition: width .18s ease, padding .18s ease;
  }
  .window.sidebar-collapsed .sidebar { width: 0; padding: 14px 0; border-right: none; overflow: hidden; }
  .sidebar-section { margin-bottom: 16px; }
  .sidebar-label { font-size: 11px; font-weight: 600; color: var(--text-tertiary); padding: 0 8px 6px; letter-spacing: 0.02em; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; color: var(--text); cursor: pointer; margin-bottom: 1px; white-space:nowrap; }
  .nav-item:hover { background: var(--bg-hover); }
  .nav-item.active { background: var(--accent); color: #fff; }
  .nav-item .ic { width: 18px; text-align: center; opacity: 0.85; }
  .sidebar-search { width: 100%; font-size: 12px; padding: 5px 8px; margin-bottom: 6px; }
  .project-item { display: flex; align-items: center; padding: 5px 6px; border-radius: 6px; font-size: 12.5px; cursor: pointer; gap: 4px; }
  .project-item:hover { background: var(--bg-hover); }
  .project-item.active { background: var(--accent); color: #fff; }
  .project-item .pname { flex:1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-item .pcost { font-variant-numeric: tabular-nums; opacity: 0.75; font-size: 10.5px; flex: none; }
  .project-item .pact { flex:none; opacity:.7; font-size:11px; padding:1px 3px; cursor:pointer; }
  .project-item .pact:hover { opacity:1; }
  .new-project-btn { width: 100%; margin-top: 4px; font-size: 12.5px; padding: 6px 8px; border-radius: 6px; border: 1px dashed var(--border); background: transparent; color: var(--accent); cursor: pointer; }
  .new-project-btn:hover { background: var(--accent-soft); }

  .content { flex: 1; overflow-y: auto; padding: 26px 34px 60px; }
  .content::-webkit-scrollbar { width: 10px; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .page-header { margin-bottom: 22px; }
  .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .page-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

  .card { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .card.compact { padding: 12px 14px; margin-bottom: 12px; }
  .card h3 { font-size: 14px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap:8px; flex-wrap:wrap; }
  .card.compact h3 { font-size: 12.5px; margin-bottom: 8px; }
  .card h3 .step-num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; margin-right: 8px; flex:none; }
  .card.compact h3 .step-num { width:16px; height:16px; font-size:9.5px; margin-right:6px; }
  .h3-actions { display:flex; gap:6px; flex-wrap:wrap; }

  .dropzone { border: 1.5px dashed var(--border); border-radius: 10px; padding: 18px; text-align: center; cursor: pointer; background: var(--bg-input); transition: border-color .15s, background .15s; }
  .card.compact .dropzone { padding: 12px; }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone .dz-icon { font-size: 22px; margin-bottom: 4px; }
  .dropzone .dz-main { font-size: 12.5px; font-weight: 500; }
  .dropzone .dz-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

  .file-chip { display: flex; align-items: center; gap: 10px; background: var(--bg-input); border: 1px solid var(--border-soft); border-radius: 9px; padding: 8px 11px; margin-top: 8px; }
  .thumb { width: 34px; height: 34px; border-radius: 6px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .file-chip .thumb { width: 32px; height: 32px; font-size: 14px; }
  .file-chip .meta { flex: 1; min-width: 0; }
  .file-chip .meta .fname { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .meta .fsub { font-size: 10.5px; color: var(--text-secondary); }
  .file-chip .remove { cursor: pointer; color: var(--text-tertiary); font-size: 15px; padding: 2px 4px; }
  .file-chip .remove:hover { color: var(--danger); }

  .btn { font-size: 12.5px; font-weight: 500; padding: 7px 13px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); cursor: pointer; }
  .btn:hover { background: var(--bg-hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--danger); border-color: rgba(255,59,48,0.3); }
  .btn.small { padding: 4px 9px; font-size: 11.5px; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  input[type=text], input[type=number], select, textarea {
    font-family: inherit; font-size: 13px; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--bg-input); color: var(--text); outline: none;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=checkbox] { accent-color: var(--accent); width:15px; height:15px; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 10.5px; padding: 6px 7px; border-bottom: 1px solid var(--border-soft); white-space:nowrap; }
  td { padding: 6px 7px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td input[type=number], td input[type=text], td select { width: 100%; padding: 5px 6px; font-size: 12px; }
  .col-tight { width: 1%; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }

  .estimate-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 13px; border-bottom: 1px solid var(--border-soft); }
  .estimate-row:last-of-type { border-bottom: none; }
  .estimate-row .label { color: var(--text-secondary); }
  .estimate-row .amt { font-variant-numeric: tabular-nums; }
  .estimate-total { display: flex; justify-content: space-between; padding-top: 12px; margin-top: 6px; border-top: 1.5px solid var(--border); font-size: 18px; font-weight: 700; }
  .breakdown-toggle { font-size: 11.5px; color: var(--accent); cursor: pointer; padding: 6px 0; -webkit-user-select:none; user-select:none; }
  .breakdown-extra.hidden { display: none; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input[type=text] { flex: 1; min-width: 160px; }
  .filter-chip { font-size: 12px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-input); cursor: pointer; color: var(--text-secondary); }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .lib-card { background: var(--bg-input); border: 1px solid var(--border-soft); border-radius: 10px; padding: 10px; cursor: default; }
  .lib-card .lib-thumb { width: 100%; height: 84px; border-radius: 7px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 22px; overflow: hidden; margin-bottom: 8px; }
  .lib-card .lib-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .lib-card .lib-name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-card .lib-meta { font-size: 10.5px; color: var(--text-secondary); margin-top: 2px; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
  .empty-state .ic { font-size: 28px; margin-bottom: 8px; }
  .empty-state .title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .empty-state .sub { font-size: 12.5px; }

  .field-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11.5px; color: var(--text-secondary); font-weight: 500; }

  code, pre { font-family: var(--mono); }
  .code-pane { background: #1e1e1e; color: #d4d4d4; border-radius: 10px; padding: 16px; font-size: 11.5px; line-height: 1.6; overflow: auto; max-height: 50vh; white-space: pre-wrap; word-break: break-word; }
  .toast {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg-content); padding: 9px 16px; border-radius: 9px; font-size: 12.5px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .badge { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); text-transform: uppercase; letter-spacing: 0.02em; }
  ::placeholder { color: var(--text-tertiary); }

  .settings-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .settings-tab { padding: 6px 13px; border-radius: 8px; font-size: 12.5px; cursor: pointer; border: 1px solid var(--border); background: var(--bg-input); }
  .settings-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .profile-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border-soft); border-radius: 8px; margin-bottom: 8px; background: var(--bg-input); }
  .profile-row .pname { flex: 1; font-size: 13px; font-weight: 500; }
  .profile-row.active { border-color: var(--accent); background: var(--accent-soft); }

  .trash-item-actions { display:flex; gap:6px; margin-top:6px; }

  @media (max-width: 760px) {
    body { padding: 0; }
    .window { height: 100vh; border-radius: 0; max-width: 100%; }
    .sidebar { position: fixed; z-index: 50; left: 0; top: 46px; bottom: 0; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); }
    .content { padding: 18px; }
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .modal-card { background: var(--bg-content); border: 1px solid var(--border-soft); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 640px; max-height: 82vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border-soft); font-size: 14px; font-weight: 600; flex: none; }
  .modal-close { cursor: pointer; color: var(--text-tertiary); font-size: 16px; padding: 2px 6px; }
  .modal-close:hover { color: var(--danger); }
  .modal-body { padding: 14px 18px; overflow-y: auto; }
  .modal-search { width: 100%; margin-bottom: 12px; }
  .modal-pick { cursor: pointer; transition: border-color .12s, transform .12s; }
  .modal-pick:hover { border-color: var(--accent); transform: translateY(-1px); }
  .qs-result { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; }
  .qs-result:hover { background: var(--bg-hover); }
  .qs-result .qs-ic { flex:none; font-size:16px; }
  .qs-result .qs-name { flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qs-result .qs-kind { flex:none; font-size:10px; color: var(--text-tertiary); text-transform:uppercase; }
  .qs-section-label { font-size:10.5px; font-weight:600; color:var(--text-tertiary); margin: 10px 0 4px; letter-spacing:.02em; }

  .print-only { position: absolute; left: -99999px; top: 0; width: 780px; }
  @media print {
    body * { visibility: hidden; }
    .print-only, .print-only * { visibility: visible; }
    .print-only { position: absolute; left: 0; top: 0; width: 100%; padding: 24px; background: #fff; color: #111; }
    .print-only table { width:100%; border-collapse: collapse; font-size: 12px; }
    .print-only th, .print-only td { border-bottom: 1px solid #ccc; padding: 6px 8px; text-align: left; }
    .print-only .p-total { font-size: 18px; font-weight: 700; border-top: 2px solid #111; padding-top:10px; margin-top:10px; }
  }
</style>
</head>
<body>

<div class="window" id="window">
  <div class="titlebar">
    <div class="traffic">
      <span class="red" id="tlRed" title="Back to Dashboard"></span>
      <span class="yellow" id="tlYellow" title="Minimize sidebar"></span>
      <span class="green" id="tlGreen" title="Search everything"></span>
    </div>
    <button class="chip-btn" id="sidebarToggle" style="display:none;">☰</button>
    <div class="titlebar-title" id="titlebarTitle">LamCraft</div>
    <div class="titlebar-actions">
      <button class="chip-btn" id="themeToggle">🌗 Theme</button>
    </div>
  </div>

  <div class="body">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">LAMCRAFT</div>
        <div class="nav-item" data-page="dashboard"><span class="ic">🏠</span>Dashboard</div>
        <div class="nav-item" data-page="library"><span class="ic">🗂️</span>File Library</div>
        <div class="nav-item" data-page="trash"><span class="ic">🗑️</span>Trash</div>
        <div class="nav-item" data-page="settings"><span class="ic">⚙️</span>Settings</div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">PROJECTS</div>
        <input type="text" class="sidebar-search" id="projectSearchInput" placeholder="Search projects…">
        <div id="projectList"></div>
        <button class="new-project-btn" id="newProjectBtn">+ New Project</button>
      </div>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="cadFileInput" accept=".c4d" style="display:none;">
<input type="file" id="laminateFileInput" accept=".jpg,.jpeg,.png,.pdf" multiple style="display:none;">
<input type="file" id="libLaminateFileInput" accept=".jpg,.jpeg,.png,.pdf" multiple style="display:none;">

<script>
  // Snapshot the static markup now, before any JS below mutates #content,
  // so the in-app "View Source" pane reflects the authored page, not runtime state.
  window.__LAMCRAFT_SOURCE__ = document.documentElement.outerHTML;
</script>

<script>
(function(){
  "use strict";

  /* ============================================================
     CONSTANTS / UTILS
     ============================================================ */
  var DAY_MS = 24 * 60 * 60 * 1000;
  var PROFILE_INDEX_KEY = "lamcraft_profiles_v1";
  var LEGACY_KEY = "lamcraft_state_v1";

  var uid = function(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); };
  var fmtMoney = function(n){
    var sym = (state && state.settings && state.settings.currency) || "₹";
    return sym + (Math.round((n||0) * 100)/100).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
  };
  var fmtDate = function(ts){ try { return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); } catch(e){ return ""; } };
  var fmtHoursLeft = function(deletedAt){
    var msLeft = DAY_MS - (Date.now() - deletedAt);
    if (msLeft <= 0) return "expiring";
    var h = Math.floor(msLeft / (60*60*1000));
    var m = Math.floor((msLeft % (60*60*1000)) / (60*1000));
    return h + "h " + m + "m left";
  };
  var esc = function(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };

  function sheetSqft(){ return (state.settings.sheetWidthFt||8) * (state.settings.sheetHeightFt||4); }

  /* ============================================================
     PROFILES (local, device-only — NOT real accounts/auth)
     ============================================================ */
  function loadProfileIndex(){
    try {
      var raw = localStorage.getItem(PROFILE_INDEX_KEY);
      if (!raw) return { active: "Default", list: ["Default"] };
      var idx = JSON.parse(raw);
      if (!idx || !idx.active || !idx.list || !idx.list.length) return { active: "Default", list: ["Default"] };
      return idx;
    } catch(e){ return { active: "Default", list: ["Default"] }; }
  }
  function saveProfileIndex(idx){ try { localStorage.setItem(PROFILE_INDEX_KEY, JSON.stringify(idx)); } catch(e){} }
  function storageKeyForProfile(name){ return "lamcraft_state_v2_" + name; }

  /* ============================================================
     STATE
     ============================================================ */
  function defaultState(){
    return {
      settings: {
        sheetWidthFt: 8, sheetHeightFt: 4,
        adhesiveKgPerSheetPerSide: 1, adhesiveCostPerKg: 260,
        defaultPlyCostPerSheet: 1400,
        defaultLaminateCostPerSheet: 850,
        defaultMarkupPercent: 15,
        defaultTaxPercent: 18,
        defaultWastePercent: 5,
        currency: "₹"
      },
      library: { cadFiles: [], laminates: [] },
      trash: { projects: [], cadFiles: [], laminates: [] },
      projects: {},
      activeProjectId: null
    };
  }

  var state = loadState();

  function loadState(){
    var idx = loadProfileIndex();
    var key = storageKeyForProfile(idx.active);
    try {
      var raw = localStorage.getItem(key);
      if (!raw && idx.active === "Default") {
        // one-time migration from the older single-profile save format
        var legacy = localStorage.getItem(LEGACY_KEY);
        if (legacy) raw = legacy;
      }
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var d = defaultState();
      return {
        settings: Object.assign({}, d.settings, parsed.settings || {}),
        library: {
          cadFiles: (parsed.library && parsed.library.cadFiles) || [],
          laminates: (parsed.library && parsed.library.laminates) || []
        },
        trash: {
          projects: (parsed.trash && parsed.trash.projects) || [],
          cadFiles: (parsed.trash && parsed.trash.cadFiles) || [],
          laminates: (parsed.trash && parsed.trash.laminates) || []
        },
        projects: parsed.projects || {},
        activeProjectId: parsed.activeProjectId || null
      };
    } catch(e){
      console.error("LamCraft: failed to load state", e);
      return defaultState();
    }
  }

  function saveState(){
    var idx = loadProfileIndex();
    var key = storageKeyForProfile(idx.active);
    try { localStorage.setItem(key, JSON.stringify(state)); }
    catch(e){ console.error("LamCraft: failed to save state", e); showToast("Couldn't save — storage may be full or unavailable"); }
  }

  function purgeExpiredTrash(){
    var now = Date.now();
    var changed = false;
    ["projects","cadFiles","laminates"].forEach(function(k){
      var before = state.trash[k].length;
      state.trash[k] = state.trash[k].filter(function(item){ return (now - item.deletedAt) < DAY_MS; });
      if (state.trash[k].length !== before) changed = true;
    });
    if (changed) saveState();
  }
  purgeExpiredTrash();

  /* ============================================================
     PROJECT HELPERS
     ============================================================ */
  function newProject(){
    var id = uid();
    state.projects[id] = {
      id: id, name: "Untitled Project " + (Object.keys(state.projects).length + 1),
      createdAt: Date.now(), updatedAt: Date.now(),
      cadFileId: null,
      laminateLines: [],
      hardwareItems: [],
      includeHardware: true,
      laborFlat: 0,
      markupPercent: state.settings.defaultMarkupPercent,
      taxPercent: state.settings.defaultTaxPercent,
      showBreakdown: false,
      notes: ""
    };
    state.activeProjectId = id;
    saveState();
    return id;
  }

  function duplicateProject(id){
    var src = state.projects[id];
    if (!src) return null;
    var copy = JSON.parse(JSON.stringify(src));
    copy.id = uid();
    copy.name = src.name + " copy";
    copy.createdAt = Date.now();
    copy.updatedAt = Date.now();
    copy.laminateLines.forEach(function(l){ l.id = uid(); });
    copy.hardwareItems.forEach(function(h){ h.id = uid(); });
    state.projects[copy.id] = copy;
    state.activeProjectId = copy.id;
    saveState();
    return copy.id;
  }

  function softDeleteProject(id){
    var p = state.projects[id];
    if (!p) return;
    state.trash.projects.push(Object.assign({}, p, { deletedAt: Date.now() }));
    delete state.projects[id];
    if (state.activeProjectId === id) state.activeProjectId = null;
    saveState();
  }
  function restoreProject(id){
    var idx = state.trash.projects.findIndex(function(p){ return p.id === id; });
    if (idx === -1) return;
    var p = state.trash.projects[idx];
    delete p.deletedAt;
    state.projects[p.id] = p;
    state.trash.projects.splice(idx, 1);
    saveState();
  }

  function activeProject(){ return state.activeProjectId ? state.projects[state.activeProjectId] : null; }
  function touchProject(p){ p.updatedAt = Date.now(); }

  function projectEstimate(p){
    var ss = sheetSqft();
    var plyCost = 0, laminateCost = 0, sheetsTotal = 0, adhesiveKg = 0;
    (p.laminateLines || []).forEach(function(line){
      var effArea = (line.areaSqft || 0) * (1 + (line.wastePercent || 0) / 100);
      var sheets = effArea / ss;
      sheetsTotal += sheets;
      plyCost += sheets * (line.plyCostPerSheet || 0);
      laminateCost += sheets * (line.laminateCostPerSheet || 0);
      adhesiveKg += sheets * (line.sides || 1) * state.settings.adhesiveKgPerSheetPerSide;
    });
    var adhesiveCost = adhesiveKg * state.settings.adhesiveCostPerKg;
    var hardwareCost = 0;
    if (p.includeHardware !== false) {
      (p.hardwareItems || []).forEach(function(h){ hardwareCost += (h.qty || 0) * (h.unitCost || 0); });
    }
    var materials = plyCost + laminateCost + adhesiveCost + hardwareCost + (p.laborFlat || 0);
    var markup = materials * ((p.markupPercent || 0) / 100);
    var preTax = materials + markup;
    var tax = preTax * ((p.taxPercent || 0) / 100);
    var total = preTax + tax;
    return {
      sheetsTotal: sheetsTotal, plyCost: plyCost, laminateCost: laminateCost,
      adhesiveKg: adhesiveKg, adhesiveCost: adhesiveCost, hardwareCost: hardwareCost,
      laborFlat: p.laborFlat || 0, materials: materials, markup: markup, preTax: preTax, tax: tax, total: total
    };
  }

  /* ============================================================
     FILE HELPERS
     ============================================================ */
  function readFileAsDataURL(file, cb){
    var reader = new FileReader();
    reader.onload = function(){ cb(reader.result); };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }
  function fileKind(name){
    var ext = (name.split(".").pop() || "").toLowerCase();
    if (ext === "pdf") return "pdf";
    if (["jpg","jpeg","png"].indexOf(ext) > -1) return "image";
    if (ext === "c4d") return "c4d";
    return "file";
  }
  function fmtSize(bytes){
    if (bytes == null) return "";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + " KB";
    return (bytes/1024/1024).toFixed(1) + " MB";
  }

  /* ============================================================
     ROUTING
     ============================================================ */
  var currentPage = "dashboard";
  var libraryFilter = "all";
  var librarySearch = "";
  var librarySort = "date";
  var projectSearch = "";
  var settingsTab = "rates";

  function go(page){ currentPage = page; render(); }
  function selectProject(id){ state.activeProjectId = id; currentPage = "project"; saveState(); render(); }

  var contentEl = document.getElementById("content");
  var projectListEl = document.getElementById("projectList");
  var titleEl = document.getElementById("titlebarTitle");

  function render(){
    renderSidebarNav();
    renderProjectList();
    if (currentPage === "project" && activeProject()) {
      titleEl.textContent = activeProject().name;
      contentEl.innerHTML = projectPageHTML(activeProject());
      bindProjectPage();
    } else if (currentPage === "library") {
      titleEl.textContent = "File Library";
      contentEl.innerHTML = libraryPageHTML();
      bindLibraryPage();
    } else if (currentPage === "trash") {
      purgeExpiredTrash();
      titleEl.textContent = "Trash";
      contentEl.innerHTML = trashPageHTML();
      bindTrashPage();
    } else if (currentPage === "settings") {
      titleEl.textContent = "Settings";
      contentEl.innerHTML = settingsPageHTML();
      bindSettingsPage();
    } else {
      currentPage = "dashboard";
      titleEl.textContent = "LamCraft";
      contentEl.innerHTML = dashboardPageHTML();
      bindDashboardPage();
    }
  }

  function renderSidebarNav(){
    document.querySelectorAll(".nav-item").forEach(function(el){
      el.classList.toggle("active", el.getAttribute("data-page") === currentPage);
    });
  }

  function renderProjectList(){
    var ids = Object.keys(state.projects)
      .filter(function(id){ return !projectSearch || state.projects[id].name.toLowerCase().indexOf(projectSearch.toLowerCase()) > -1; })
      .sort(function(a,b){ return state.projects[b].updatedAt - state.projects[a].updatedAt; });

    if (!ids.length) {
      projectListEl.innerHTML = '<div style="font-size:11.5px;color:var(--text-tertiary);padding:4px 8px;">No projects</div>';
      return;
    }
    projectListEl.innerHTML = ids.map(function(id){
      var p = state.projects[id];
      var est = projectEstimate(p);
      var active = (currentPage === "project" && state.activeProjectId === id);
      return '<div class="project-item ' + (active ? "active" : "") + '" data-id="' + id + '">' +
        '<span class="pname" data-open="' + id + '">' + esc(p.name) + '</span>' +
        '<span class="pcost">' + fmtMoney(est.total) + '</span>' +
        '<span class="pact" data-rename="' + id + '" title="Rename">✎</span>' +
        '<span class="pact" data-trash="' + id + '" title="Delete">🗑</span>' +
        '</div>';
    }).join("");
    projectListEl.querySelectorAll("[data-open]").forEach(function(el){
      el.addEventListener("click", function(){ selectProject(el.getAttribute("data-open")); });
    });
    projectListEl.querySelectorAll("[data-rename]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var id = el.getAttribute("data-rename");
        var p = state.projects[id];
        var name = prompt("Rename project", p.name);
        if (name && name.trim()) { p.name = name.trim(); touchProject(p); saveState(); render(); if (state.activeProjectId === id) titleEl.textContent = p.name; }
      });
    });
    projectListEl.querySelectorAll("[data-trash]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var id = el.getAttribute("data-trash");
        var p = state.projects[id];
        if (!confirm('Delete "' + p.name + '"? You can restore it from Trash within 24 hours.')) return;
        softDeleteProject(id);
        if (currentPage === "project" && state.activeProjectId == null) currentPage = "dashboard";
        showToast("Moved to Trash");
        render();
      });
    });
  }

  /* ============================================================
     GENERIC PICKER MODAL (used for laminate library, CAD library)
     ============================================================ */
  function openPickerModal(opts){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal-card">' +
        '<div class="modal-header"><span>' + esc(opts.title) + '</span><span class="modal-close" id="pmClose">✕</span></div>' +
        '<div class="modal-body"><input type="text" class="modal-search" id="pmSearch" placeholder="Search…"><div class="lib-grid" id="pmGrid"></div></div>' +
      '</div>';
    document.body.appendChild(overlay);
    function closeModal(){ overlay.remove(); }
    overlay.addEventListener("click", function(e){ if (e.target === overlay) closeModal(); });
    document.getElementById("pmClose").addEventListener("click", closeModal);

    function renderGrid(filterText){
      var grid = document.getElementById("pmGrid");
      var items = opts.items.filter(function(it){ return !filterText || opts.getLabel(it).toLowerCase().indexOf(filterText.toLowerCase()) > -1; });
      if (!items.length) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;padding:20px;"><div class="ic">🔍</div><div class="sub">No matches</div></div>'; return; }
      grid.innerHTML = items.map(function(it){
        return '<div class="lib-card modal-pick" data-pick="' + it.__pickId + '">' +
          '<div class="lib-thumb">' + opts.getThumb(it) + '</div>' +
          '<div class="lib-name">' + esc(opts.getLabel(it)) + '</div>' +
          '<div class="lib-meta">' + esc(opts.getMeta(it)) + '</div>' +
          '</div>';
      }).join("");
      grid.querySelectorAll("[data-pick]").forEach(function(el){
        el.addEventListener("click", function(){
          var picked = opts.items.find(function(it){ return it.__pickId === el.getAttribute("data-pick"); });
          if (picked) { opts.onPick(picked); closeModal(); }
        });
      });
    }
    opts.items.forEach(function(it, i){ it.__pickId = it.id || ("i" + i); });
    renderGrid("");
    var search = document.getElementById("pmSearch");
    search.addEventListener("input", function(e){ renderGrid(e.target.value); });
    search.focus();
  }

  /* ============================================================
     QUICK SEARCH (green traffic light — search everything)
     ============================================================ */
  function openQuickSearch(){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal-card">' +
        '<div class="modal-header"><span>Search LamCraft</span><span class="modal-close" id="qsClose">✕</span></div>' +

    document.getElementById("qsClose").addEventListener("click", closeModal);

    function renderResults(q){
      q = (q || "").toLowerCase();
      var results = document.getElementById("qsResults");
      var projMatches = Object.keys(state.projects).map(function(id){ return state.projects[id]; }).filter(function(p){ return !q || p.name.toLowerCase().indexOf(q) > -1; });
      var cadMatches = state.library.cadFiles.filter(function(f){ return !q || f.name.toLowerCase().indexOf(q) > -1; });
      var lamMatches = state.library.laminates.filter(function(f){ return !q || f.name.toLowerCase().indexOf(q) > -1; });
      var html = "";
      if (projMatches.length) {
        html += '<div class="qs-section-label">Projects</div>' + projMatches.map(function(p){
          return '<div class="qs-result" data-goto-project="' + p.id + '"><span class="qs-ic">🪑</span><span class="qs-name">' + esc(p.name) + '</span><span class="qs-kind">project</span></div>';
        }).join("");
      }
      if (cadMatches.length) {
        html += '<div class="qs-section-label">CAD files</div>' + cadMatches.map(function(f){

        }).join("");
      }
      if (lamMatches.length) {
        html += '<div class="qs-section-label">Laminates</div>' + lamMatches.map(function(f){
          return '<div class="qs-result" data-goto-library="laminate"><span class="qs-ic">🎨</span><span class="qs-name">' + esc(f.name) + '</span><span class="qs-kind">laminate</span></div>';
        }).join("");
      }

      results.querySelectorAll("[data-goto-project]").forEach(function(el){

      });
      results.querySelectorAll("[data-goto-library]").forEach(function(el){
        el.addEventListener("click", function(){ libraryFilter = el.getAttribute("data-goto-library"); go("library"); closeModal(); });
      });
    }
    renderResults("");
    var input = document.getElementById("qsInput");
    input.addEventListener("input", function(e){ renderResults(e.target.value); });
    input.focus();
  }

  function bindProjectPage(){
    var p = activeProject();
    if (!p) return;

    var cadDz = document.getElementById("cadDropzone");
    if (cadDz) {
      cadDz.addEventListener("click", function(){ document.getElementById("cadFileInput").click(); });
      ["dragover","dragenter"].forEach(function(ev){ cadDz.addEventListener(ev, function(e){ e.preventDefault(); cadDz.classList.add("drag"); }); });
      ["dragleave","drop"].forEach(function(ev){ cadDz.addEventListener(ev, function(e){ e.preventDefault(); cadDz.classList.remove("drag"); }); });
      cadDz.addEventListener("drop", function(e){ var f = e.dataTransfer.files[0]; if (f) handleCadFile(f); });
    }
    var removeCad = document.querySelector("[data-remove-cad]");
    if (removeCad) removeCad.addEventListener("click", function(){ p.cadFileId = null; touchProject(p); saveState(); render(); });

    document.getElementById("cadUploadBtn").addEventListener("click", function(){ document.getElementById("cadFileInput").click(); });
    document.getElementById("cadLibraryBtn").addEventListener("click", openCadPicker);
    document.getElementById("uploadLaminateBtn").addEventListener("click", function(){ document.getElementById("laminateFileInput").click(); });
    document.getElementById("pickLibraryBtn").addEventListener("click", openLibraryPicker);
    document.getElementById("areaHelperBtn").addEventListener("click", openAreaHelper);

    document.querySelectorAll("[data-remove-line]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-remove-line");

        touchProject(p); saveState(); render();
      });
    });
    document.querySelectorAll("tr[data-line]").forEach(function(row){
      var id = row.getAttribute("data-line");
      var line = p.laminateLines.find(function(l){ return l.id === id; });
      if (!line) return;
      row.querySelector(".ln-sides").addEventListener("change", function(e){ line.sides = parseInt(e.target.value,10); touchProject(p); saveState(); updateProjectNumbers(p); });
      row.querySelector(".ln-area").addEventListener("input", function(e){ line.areaSqft = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });
      row.querySelector(".ln-waste").addEventListener("input", function(e){ line.wastePercent = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });
      row.querySelector(".ln-ply").addEventListener("input", function(e){ line.plyCostPerSheet = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });
      row.querySelector(".ln-lam").addEventListener("input", function(e){ line.laminateCostPerSheet = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });
    });

    document.getElementById("addHwBtn").addEventListener("click", function(){
      p.hardwareItems.push({ id: uid(), name: "Hinge", qty: 1, unitCost: 0 });
      touchProject(p); saveState(); render();
    });
    document.getElementById("hwInclude").addEventListener("change", function(e){ p.includeHardware = e.target.checked; touchProject(p); saveState(); updateProjectNumbers(p); });
    document.querySelectorAll("[data-remove-hw]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-remove-hw");
        p.hardwareItems = p.hardwareItems.filter(function(h){ return h.id !== id; });
        touchProject(p); saveState(); render();
      });
    });
    document.querySelectorAll("tr[data-hw]").forEach(function(row){
      var id = row.getAttribute("data-hw");
      var h = p.hardwareItems.find(function(x){ return x.id === id; });
      if (!h) return;
      row.querySelector(".hw-name").addEventListener("input", function(e){ h.name = e.target.value; touchProject(p); saveState(); });
      row.querySelector(".hw-qty").addEventListener("input", function(e){ h.qty = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });
      row.querySelector(".hw-cost").addEventListener("input", function(e){ h.unitCost = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });
    });

    var nameInput = document.getElementById("projName");
    nameInput.addEventListener("input", function(e){ p.name = e.target.value || "Untitled Project"; touchProject(p); saveState(); renderProjectList(); titleEl.textContent = p.name; });

    document.getElementById("markupPct").addEventListener("input", function(e){ p.markupPercent = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });
    document.getElementById("taxPct").addEventListener("input", function(e){ p.taxPercent = parseFloat(e.target.value)||0; touchProject(p); saveState(); updateProjectNumbers(p); });

    document.getElementById("breakdownToggle").addEventListener("click", function(){

    document.getElementById("exportPdfBtn").addEventListener("click", function(){ exportProjectPdf(p); });
    document.getElementById("duplicateProjectBtn").addEventListener("click", function(){ duplicateProject(p.id); showToast("Duplicated"); render(); });
    document.getElementById("saveProjectBtn").addEventListener("click", function(){ touchProject(p); saveState(); showToast("Project saved"); renderProjectList(); });
    document.getElementById("deleteProjectBtn").addEventListener("click", function(){
      if (!confirm('Delete "' + p.name + '"? You can restore it from Trash within 24 hours.')) return;
      softDeleteProject(p.id);
      currentPage = "dashboard";
      showToast("Moved to Trash");
      render();
    });

  function updateProjectNumbers(p){
    var est = projectEstimate(p);
    var ss = sheetSqft();
    document.querySelectorAll("tr[data-line]").forEach(function(row){
      var id = row.getAttribute("data-line");
      var line = p.laminateLines.find(function(l){ return l.id === id; });
      if (!line) return;
      var effArea = (line.areaSqft || 0) * (1 + (line.wastePercent || 0) / 100);
      var sheets = effArea / ss;
      var plyLineCost = sheets * (line.plyCostPerSheet || 0);
      var lamLineCost = sheets * (line.laminateCostPerSheet || 0);
      setCell(row, ".ln-sheets-cell", sheets.toFixed(2));
      setCell(row, ".ln-ply-total", fmtMoney(plyLineCost));
      setCell(row, ".ln-lam-total", fmtMoney(lamLineCost));
    });
    document.querySelectorAll("tr[data-hw]").forEach(function(row){
      var id = row.getAttribute("data-hw");
      var h = p.hardwareItems.find(function(x){ return x.id === id; });
      if (!h) return;
      setCell(row, ".hw-total", fmtMoney((h.qty||0)*(h.unitCost||0)));
    });

    setText("est-sheets", est.sheetsTotal.toFixed(2));
    setText("est-adhkg", est.adhesiveKg.toFixed(2) + " kg");
    setText("est-adhcost", fmtMoney(est.adhesiveCost));

    setText("fe-ply", fmtMoney(est.plyCost));
    setText("fe-laminate", fmtMoney(est.laminateCost));
    setText("fe-adhesive", fmtMoney(est.adhesiveCost));
    setText("fe-hardware", fmtMoney(est.hardwareCost));
    setText("fe-labor", fmtMoney(est.laborFlat));
    setText("fe-materials", fmtMoney(est.materials));
    setText("fe-markup-label", "Markup (" + (p.markupPercent || 0) + "%)");
    setText("fe-markup", fmtMoney(est.markup));
    setText("fe-tax-label", "Tax (" + (p.taxPercent || 0) + "%)");
    setText("fe-tax", fmtMoney(est.tax));
    setText("fe-total", fmtMoney(est.total));

    renderProjectList();
  }
  function setText(id, text){ var el = document.getElementById(id); if (el) el.textContent = text; }
  function setCell(row, sel, text){ var el = row.querySelector(sel); if (el) el.textContent = text; }

  function handleCadFile(file){
    var p = activeProject();
    if (!p) return;
    var entry = { id: uid(), name: file.name, size: file.size, uploadedAt: Date.now(), kind: "c4d" };
    state.library.cadFiles.push(entry);
    p.cadFileId = entry.id;
    touchProject(p); saveState(); showToast("CAD file added"); render();
  }

  function openCadPicker(){
    if (!state.library.cadFiles.length) { showToast("No CAD files in library yet — upload one first"); return; }
    var p = activeProject();
    openPickerModal({
      title: "Choose a CAD file",
      items: state.library.cadFiles.slice(),
      getLabel: function(f){ return f.name; },
      getMeta: function(f){ return fmtSize(f.size) + " · " + fmtDate(f.uploadedAt); },
      getThumb: function(){ return "🧊"; },
      onPick: function(f){ p.cadFileId = f.id; touchProject(p); saveState(); showToast("CAD file linked"); render(); }
    });
  }

  function handleLaminateFiles(fileList){
    var p = activeProject();
    if (!p) return;
    var files = Array.prototype.slice.call(fileList);
    var remaining = files.length;
    if (!remaining) return;
    files.forEach(function(file){
      var kind = fileKind(file.name);
      var finalize = function(dataUrl){
        var libEntry = { id: uid(), name: file.name, kind: kind, size: file.size, uploadedAt: Date.now(), costPerSheet: state.settings.defaultLaminateCostPerSheet, thumbnail: (kind === "image") ? dataUrl : null };
        state.library.laminates.push(libEntry);
        p.laminateLines.push({
          id: uid(), libraryLaminateId: libEntry.id, name: file.name,
          laminateCostPerSheet: libEntry.costPerSheet, plyCostPerSheet: state.settings.defaultPlyCostPerSheet,
          areaSqft: sheetSqft(), sides: 1, wastePercent: state.settings.defaultWastePercent, thumbnail: libEntry.thumbnail
        });
        remaining--;
        if (remaining === 0) { touchProject(p); saveState(); showToast("Laminate added"); render(); }
      };
      if (kind === "image") readFileAsDataURL(file, finalize); else finalize(null);
    });
  }

  function openLibraryPicker(){
    var p = activeProject();
    if (!p) return;
    if (!state.library.laminates.length) { showToast("Library is empty — upload a laminate first"); return; }
    openPickerModal({
      title: "Choose a laminate",
      items: state.library.laminates.slice(),
      getLabel: function(l){ return l.name; },
      getMeta: function(l){ return fmtMoney(l.costPerSheet) + "/sheet"; },
      getThumb: function(l){ return l.thumbnail ? '<img src="' + l.thumbnail + '">' : (l.kind === "pdf" ? "📄" : "🎨"); },
      onPick: function(lam){
        p.laminateLines.push({
          id: uid(), libraryLaminateId: lam.id, name: lam.name,
          laminateCostPerSheet: lam.costPerSheet, plyCostPerSheet: state.settings.defaultPlyCostPerSheet,
          areaSqft: sheetSqft(), sides: 1, wastePercent: state.settings.defaultWastePercent, thumbnail: lam.thumbnail
        });
        touchProject(p); saveState(); showToast("Added from library"); render();
      }
    });
  }

  /* ---- Surface Area Helper (manual substitute for real CAD parsing) ---- */
  function openAreaHelper(){
    var p = activeProject();
    if (!p) return;
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal-card" style="max-width:420px;">' +
        '<div class="modal-header"><span>Surface Area Helper</span><span class="modal-close" id="ahClose">✕</span></div>' +
        '<div class="modal-body">' +
          '<div class="page-sub" style="margin-bottom:12px;">Browsers can\'t read geometry out of a .c4d file — enter the panel size and how many faces get laminated, and this works out the sqft for you.</div>' +
          '<div class="field-row">' +
            '<div class="field"><label>Length (ft)</label><input type="number" id="ahLen" min="0" step="0.1" value="4"></div>' +
            '<div class="field"><label>Width (ft)</label><input type="number" id="ahWid" min="0" step="0.1" value="2"></div>' +
            '<div class="field"><label>Faces</label><input type="number" id="ahFaces" min="1" step="1" value="1"></div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;margin:8px 0 14px;">' +
            '<button class="btn small" data-faces="1">1 face (tabletop)</button>' +
            '<button class="btn small" data-faces="2">2 faces (panel)</button>' +
            '<button class="btn small" data-faces="6">6 faces (box)</button>' +
          '</div>' +
          '<div class="estimate-row"><span class="label">Computed area</span><span class="amt" id="ahResult">8.00 sqft</span></div>' +
          '<button class="btn primary" id="ahAdd" style="width:100%;margin-top:12px;">+ Add as new laminate line</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    function closeModal(){ overlay.remove(); }
    overlay.addEventListener("click", function(e){ if (e.target === overlay) closeModal(); });
    document.getElementById("ahClose").addEventListener("click", closeModal);

    function compute(){
      var L = parseFloat(document.getElementById("ahLen").value) || 0;
      var W = parseFloat(document.getElementById("ahWid").value) || 0;
      var F = parseFloat(document.getElementById("ahFaces").value) || 1;
      var sqft = L * W * F;
      document.getElementById("ahResult").textContent = sqft.toFixed(2) + " sqft";
      return sqft;
    }
    ["ahLen","ahWid","ahFaces"].forEach(function(id){ document.getElementById(id).addEventListener("input", compute); });
    document.querySelectorAll("[data-faces]").forEach(function(btn){
      btn.addEventListener("click", function(){ document.getElementById("ahFaces").value = btn.getAttribute("data-faces"); compute(); });
    });
    compute();

    document.getElementById("ahAdd").addEventListener("click", function(){
      var sqft = compute();
      p.laminateLines.push({
        id: uid(), libraryLaminateId: null, name: "Laminate (from Area helper)",
        laminateCostPerSheet: state.settings.defaultLaminateCostPerSheet, plyCostPerSheet: state.settings.defaultPlyCostPerSheet,
        areaSqft: sqft, sides: 1, wastePercent: state.settings.defaultWastePercent, thumbnail: null
      });
      touchProject(p); saveState(); showToast("Laminate line added");
      closeModal(); render();
    });
  }

        '<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Ply materials</span><span>' + fmtMoney(est.plyCost) + '</span></div>' +
        '<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Laminate materials</span><span>' + fmtMoney(est.laminateCost) + '</span></div>' +
        '<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Adhesive</span><span>' + fmtMoney(est.adhesiveCost) + '</span></div>' +
        '<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Hardware</span><span>' + fmtMoney(est.hardwareCost) + '</span></div>' +
        '<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Labor</span><span>' + fmtMoney(est.laborFlat) + '</span></div>' +
        breakdownHTML +
        '<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Tax (' + (p.taxPercent||0) + '%)</span><span>' + fmtMoney(est.tax) + '</span></div>' +
        '<div class="p-total" style="display:flex;justify-content:space-between;"><span>Total</span><span>' + fmtMoney(est.total) + '</span></div>' +
      '</div>';

    var wrap = document.createElement("div");
    wrap.className = "print-only";
    wrap.id = "printWrap";
    wrap.innerHTML = html;
    document.body.appendChild(wrap);
    window.print();
    setTimeout(function(){ var el = document.getElementById("printWrap"); if (el) el.remove(); }, 500);
  }

  /* ============================================================
     LIBRARY PAGE
     ============================================================ */
  function libraryFilteredSorted(){
    var all = state.library.cadFiles.map(function(f){ return Object.assign({}, f, {type:"cad"}); })
      .concat(state.library.laminates.map(function(f){ return Object.assign({}, f, {type:"laminate"}); }));
    var filtered = all.filter(function(f){
      if (libraryFilter === "cad" && f.type !== "cad") return false;
      if (libraryFilter === "laminate" && f.type !== "laminate") return false;
      if (librarySearch && f.name.toLowerCase().indexOf(librarySearch.toLowerCase()) === -1) return false;
      return true;
    });
    filtered.sort(function(a,b){
      if (librarySort === "name") return a.name.localeCompare(b.name);
      if (librarySort === "cost") return (b.costPerSheet||0) - (a.costPerSheet||0);
      return b.uploadedAt - a.uploadedAt;
    });
    return filtered;
  }
  function libraryGridHTML(){
    var filtered = libraryFilteredSorted();
    var cards = filtered.map(function(f){
      var thumb = f.type === "cad" ? "🧊" : (f.thumbnail ? '<img src="' + f.thumbnail + '">' : (f.kind === "pdf" ? "📄" : "🎨"));
      var meta = f.type === "cad" ? fmtSize(f.size) + " · " + fmtDate(f.uploadedAt) : fmtMoney(f.costPerSheet) + "/sheet · " + fmtDate(f.uploadedAt);
      return '<div class="lib-card">' +
        '<div class="lib-thumb">' + thumb + '</div>' +
        '<div class="lib-name">' + esc(f.name) + ' <span class="badge">' + f.type + '</span></div>' +
        '<div class="lib-meta">' + meta + '</div>' +
        (f.type === "laminate" ? '<div style="margin-top:6px;"><input type="number" class="lib-cost-input" data-id="' + f.id + '" value="' + (f.costPerSheet||0) + '" style="width:100%;font-size:11.5px;padding:4px 6px;"></div>' : '') +
        '<div style="margin-top:6px;"><span class="remove" data-lib-remove="' + f.id + '" data-lib-type="' + f.type + '" style="font-size:11px;">Remove</span></div>' +
        '</div>';
    }).join("");
    return filtered.length ? '<div class="lib-grid">' + cards + '</div>' :
      '<div class="empty-state"><div class="ic">🗂️</div><div class="title">No files match</div><div class="sub">Try a different search or upload something new.</div></div>';
  }

      '<div class="page-header"><div class="page-title">File Library</div><div class="page-sub">Every CAD file and laminate swatch uploaded across all projects, in one place.</div></div>' +
      '<div class="toolbar">' +
        '<input type="text" id="librarySearchInput" placeholder="Search files…" value="' + esc(librarySearch) + '">' +
        '<div class="filter-chip ' + (libraryFilter==="all"?"active":"") + '" data-filter="all">All</div>' +
        '<div class="filter-chip ' + (libraryFilter==="cad"?"active":"") + '" data-filter="cad">CAD</div>' +
        '<div class="filter-chip ' + (libraryFilter==="laminate"?"active":"") + '" data-filter="laminate">Laminates</div>' +
        '<select id="librarySortSelect" style="margin-left:auto;">' +
          '<option value="date"' + (librarySort==="date"?" selected":"") + '>Sort: Newest</option>' +
          '<option value="name"' + (librarySort==="name"?" selected":"") + '>Sort: Name</option>' +
          '<option value="cost"' + (librarySort==="cost"?" selected":"") + '>Sort: Cost</option>' +
        '</select>' +
        '<button class="btn small" id="libUploadBtn">📤 Upload laminate</button>' +
      '</div>' +
      '<div id="libraryGrid">' + libraryGridHTML() + '</div>';
  }
  function refreshLibraryGrid(){
    var el = document.getElementById("libraryGrid");
    if (!el) return;
    el.innerHTML = libraryGridHTML();
    bindLibraryGridItems();
  }
  function bindLibraryGridItems(){
    document.querySelectorAll("[data-lib-remove]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-lib-remove");
        var type = el.getAttribute("data-lib-type");
        if (!confirm("Move this file to Trash? You can restore it within 24 hours.")) return;
        if (type === "cad") {
          var idxc = state.library.cadFiles.findIndex(function(f){ return f.id === id; });
          if (idxc > -1) { var it = state.library.cadFiles[idxc]; state.trash.cadFiles.push(Object.assign({}, it, {deletedAt: Date.now()})); state.library.cadFiles.splice(idxc,1); }
        } else {
          var idxl = state.library.laminates.findIndex(function(f){ return f.id === id; });
          if (idxl > -1) { var it2 = state.library.laminates[idxl]; state.trash.laminates.push(Object.assign({}, it2, {deletedAt: Date.now()})); state.library.laminates.splice(idxl,1); }
        }
        saveState(); showToast("Moved to Trash"); refreshLibraryGrid();
      });
    });
    document.querySelectorAll(".lib-cost-input").forEach(function(el){
      el.addEventListener("input", function(e){
        var id = el.getAttribute("data-id");
        var lam = state.library.laminates.find(function(f){ return f.id === id; });
        if (lam) { lam.costPerSheet = parseFloat(e.target.value)||0; saveState(); }
      });
    });
  }
  function bindLibraryPage(){
    var search = document.getElementById("librarySearchInput");
    search.addEventListener("input", function(e){ librarySearch = e.target.value; refreshLibraryGrid(); });
    document.querySelectorAll(".filter-chip").forEach(function(el){
      el.addEventListener("click", function(){
        libraryFilter = el.getAttribute("data-filter");
        document.querySelectorAll(".filter-chip").forEach(function(c){ c.classList.toggle("active", c.getAttribute("data-filter") === libraryFilter); });
        refreshLibraryGrid();
      });
    });
    document.getElementById("librarySortSelect").addEventListener("change", function(e){ librarySort = e.target.value; refreshLibraryGrid(); });
    document.getElementById("libUploadBtn").addEventListener("click", function(){ document.getElementById("libLaminateFileInput").click(); });
    bindLibraryGridItems();
  }

  /* ============================================================
     TRASH PAGE
     ============================================================ */
  function trashPageHTML(){
    var hasAny = state.trash.projects.length || state.trash.cadFiles.length || state.trash.laminates.length;
    if (!hasAny) {
      return '<div class="page-header"><div class="page-title">Trash</div><div class="page-sub">Deleted projects and files stay here for 24 hours before they\'re gone for good.</div></div>' +
        '<div class="empty-state"><div class="ic">🗑️</div><div class="title">Trash is empty</div><div class="sub">Nothing deleted in the last 24 hours.</div></div>';
    }
    var out = '<div class="page-header"><div class="page-title">Trash</div><div class="page-sub">Deleted projects and files stay here for 24 hours before they\'re gone for good.</div></div>';

    if (state.trash.projects.length) {
      out += '<h3 style="font-size:13px;margin-bottom:10px;">Projects</h3><div class="lib-grid" style="margin-bottom:20px;">' +
        state.trash.projects.map(function(p){
          return '<div class="lib-card"><div class="lib-thumb">🪑</div><div class="lib-name">' + esc(p.name) + '</div>' +
            '<div class="lib-meta">' + fmtHoursLeft(p.deletedAt) + '</div>' +
            '<div class="trash-item-actions"><button class="btn small" data-restore-project="' + p.id + '">Restore</button></div></div>';
        }).join("") + '</div>';
    }
    if (state.trash.cadFiles.length) {
      out += '<h3 style="font-size:13px;margin-bottom:10px;">CAD files</h3><div class="lib-grid" style="margin-bottom:20px;">' +
        state.trash.cadFiles.map(function(f){
          return '<div class="lib-card"><div class="lib-thumb">🧊</div><div class="lib-name">' + esc(f.name) + '</div>' +
            '<div class="lib-meta">' + fmtHoursLeft(f.deletedAt) + '</div>' +
            '<div class="trash-item-actions"><button class="btn small" data-restore-cad="' + f.id + '">Restore</button></div></div>';
        }).join("") + '</div>';
    }
    if (state.trash.laminates.length) {
      out += '<h3 style="font-size:13px;margin-bottom:10px;">Laminates</h3><div class="lib-grid">' +
        state.trash.laminates.map(function(f){
          var thumb = f.thumbnail ? '<img src="' + f.thumbnail + '">' : "🎨";
          return '<div class="lib-card"><div class="lib-thumb">' + thumb + '</div><div class="lib-name">' + esc(f.name) + '</div>' +
            '<div class="lib-meta">' + fmtHoursLeft(f.deletedAt) + '</div>' +
            '<div class="trash-item-actions"><button class="btn small" data-restore-lam="' + f.id + '">Restore</button></div></div>';
        }).join("") + '</div>';
    }
    return out;
  }
  function bindTrashPage(){
    document.querySelectorAll("[data-restore-project]").forEach(function(el){
      el.addEventListener("click", function(){ restoreProject(el.getAttribute("data-restore-project")); showToast("Project restored"); render(); });
    });
    document.querySelectorAll("[data-restore-cad]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-restore-cad");
        var idx = state.trash.cadFiles.findIndex(function(f){ return f.id === id; });
        if (idx > -1) { var it = state.trash.cadFiles[idx]; delete it.deletedAt; state.library.cadFiles.push(it); state.trash.cadFiles.splice(idx,1); saveState(); showToast("Restored"); render(); }
      });
    });
    document.querySelectorAll("[data-restore-lam]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-restore-lam");
        var idx = state.trash.laminates.findIndex(function(f){ return f.id === id; });
        if (idx > -1) { var it = state.trash.laminates[idx]; delete it.deletedAt; state.library.laminates.push(it); state.trash.laminates.splice(idx,1); saveState(); showToast("Restored"); render(); }
      });
    });
  }

  /* ============================================================
     SETTINGS PAGE (Rates / Account / Data & Source)
     ============================================================ */
  function settingsPageHTML(){
    var tabs = [["rates","Rates & Costs"],["account","Account"],["data","Data & Source"]];
    var tabHTML = tabs.map(function(t){ return '<div class="settings-tab ' + (settingsTab===t[0]?"active":"") + '" data-tab="' + t[0] + '">' + t[1] + '</div>'; }).join("");
    return '<div class="page-header"><div class="page-title">Settings</div><div class="page-sub">Rates, local profiles, and data — all in one place.</div></div>' +
      '<div class="settings-tabs">' + tabHTML + '</div>' +
      '<div id="settingsTabBody">' + settingsTabBodyHTML() + '</div>';
  }
  function settingsTabBodyHTML(){
    var s = state.settings;
    if (settingsTab === "rates") {
      return '' +
        '<div class="card"><h3>Sheet size</h3><div class="field-row">' +
          '<div class="field"><label>Width (ft)</label><input type="number" id="s-sheetW" value="' + s.sheetWidthFt + '" step="0.5" min="0.5"></div>' +
          '<div class="field"><label>Height (ft)</label><input type="number" id="s-sheetH" value="' + s.sheetHeightFt + '" step="0.5" min="0.5"></div>' +
          '<div class="field"><label>Sheet area</label><div style="padding-top:7px;font-size:13px;">' + (s.sheetWidthFt*s.sheetHeightFt) + ' sqft</div></div>' +
        '</div></div>' +
        '<div class="card"><h3>Adhesive</h3><div class="page-sub" style="margin-bottom:10px;">1 sheet needs this much adhesive per side laminated.</div><div class="field-row">' +
          '<div class="field"><label>kg per sheet, per side</label><input type="number" id="s-adhKg" value="' + s.adhesiveKgPerSheetPerSide + '" step="0.05" min="0"></div>' +
          '<div class="field"><label>Cost per kg</label><input type="number" id="s-adhCost" value="' + s.adhesiveCostPerKg + '" step="1" min="0"></div>' +
        '</div></div>' +
        '<div class="card"><h3>Defaults for new laminate lines</h3><div class="field-row">' +
          '<div class="field"><label>Default ply cost / sheet</label><input type="number" id="s-defPlyCost" value="' + s.defaultPlyCostPerSheet + '" step="10" min="0"></div>' +
          '<div class="field"><label>Default laminate cost / sheet</label><input type="number" id="s-defLamCost" value="' + s.defaultLaminateCostPerSheet + '" step="10" min="0"></div>' +
          '<div class="field"><label>Default waste %</label><input type="number" id="s-defWaste" value="' + s.defaultWastePercent + '" step="1" min="0"></div>' +
        '</div></div>' +
        '<div class="card"><h3>Default project rates</h3><div class="field-row">' +
          '<div class="field"><label>Default markup %</label><input type="number" id="s-defMarkup" value="' + s.defaultMarkupPercent + '" step="0.5" min="0"></div>' +
          '<div class="field"><label>Default tax %</label><input type="number" id="s-defTax" value="' + s.defaultTaxPercent + '" step="0.5" min="0"></div>' +
          '<div class="field"><label>Currency symbol</label><select id="s-currency">' +
            ["₹","$","€","£","¥"].map(function(c){ return '<option value="' + c + '"' + (s.currency===c?" selected":"") + '>' + c + '</option>'; }).join("") +
          '</select></div>' +
        '</div></div>';
    }
    if (settingsTab === "account") {
      var idx = loadProfileIndex();
      var rows = idx.list.map(function(name){
        return '<div class="profile-row ' + (name===idx.active?"active":"") + '">' +
          '<span class="pname">' + esc(name) + (name===idx.active ? " (current)" : "") + '</span>' +
          (name===idx.active ? '' : '<button class="btn small" data-switch-profile="' + esc(name) + '">Switch</button>') +
          '<button class="btn small" data-rename-profile="' + esc(name) + '">Rename</button>' +
          (idx.list.length > 1 ? '<button class="btn small danger" data-delete-profile="' + esc(name) + '">Delete</button>' : '') +
        '</div>';
      }).join("");
      return '<div class="card"><h3>Local profiles</h3>' +
        '<div class="page-sub" style="margin-bottom:12px;">These are separate local workspaces on this device only — not real accounts. There\'s no password, no email verification, and nothing syncs across devices or browsers. Use them just to keep different sets of projects apart on this one device.</div>' +
        rows +
        '<button class="btn" id="addProfileBtn" style="margin-top:8px;">+ Add profile</button>' +
      '</div>';
    }
    // data tab
    return '<div class="card"><h3>Data</h3><div style="display:flex;gap:8px;flex-wrap:wrap;">' +
        '<button class="btn" id="exportBtn">⬇️ Export this profile\'s data (JSON)</button>' +
        '<button class="btn danger" id="resetBtn">Reset this profile</button>' +
      '</div></div>' +
      '<div class="card"><h3>View Source</h3><div class="page-sub" style="margin-bottom:10px;">This entire app is a single self-contained HTML file — no build step, no server.</div>' +
      '<div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><button class="btn small" id="copySourceBtn">📋 Copy source</button></div>' +
      '<div class="code-pane" id="codePane">' + esc(window.__LAMCRAFT_SOURCE__ || "Source unavailable") + '</div></div>';
  }
  function bindSettingsPage(){
    document.querySelectorAll(".settings-tab").forEach(function(el){
      el.addEventListener("click", function(){ settingsTab = el.getAttribute("data-tab"); render(); });
    });
    if (settingsTab === "rates") {
      var s = state.settings;
      function bindNum(id, key){ document.getElementById(id).addEventListener("input", function(e){ s[key] = parseFloat(e.target.value) || 0; saveState(); }); }
      bindNum("s-sheetW","sheetWidthFt"); bindNum("s-sheetH","sheetHeightFt");
      bindNum("s-adhKg","adhesiveKgPerSheetPerSide"); bindNum("s-adhCost","adhesiveCostPerKg");
      bindNum("s-defPlyCost","defaultPlyCostPerSheet"); bindNum("s-defLamCost","defaultLaminateCostPerSheet"); bindNum("s-defWaste","defaultWastePercent");
      bindNum("s-defMarkup","defaultMarkupPercent"); bindNum("s-defTax","defaultTaxPercent");
      document.getElementById("s-currency").addEventListener("change", function(e){ s.currency = e.target.value; saveState(); });
    } else if (settingsTab === "account") {
      document.querySelectorAll("[data-switch-profile]").forEach(function(el){
        el.addEventListener("click", function(){
          var idx = loadProfileIndex(); idx.active = el.getAttribute("data-switch-profile"); saveProfileIndex(idx);
          state = loadState(); purgeExpiredTrash(); currentPage = "dashboard"; showToast("Switched profile"); render();
        });
      });
      document.querySelectorAll("[data-rename-profile]").forEach(function(el){
        el.addEventListener("click", function(){
          var oldName = el.getAttribute("data-rename-profile");
          var newName = prompt("Rename profile", oldName);
          if (!newName || !newName.trim() || newName === oldName) return;
          var idx = loadProfileIndex();
          if (idx.list.indexOf(newName) > -1) { showToast("A profile with that name already exists"); return; }
          var raw = localStorage.getItem(storageKeyForProfile(oldName));
          if (raw) { try { localStorage.setItem(storageKeyForProfile(newName), raw); localStorage.removeItem(storageKeyForProfile(oldName)); } catch(e){} }
          idx.list = idx.list.map(function(n){ return n === oldName ? newName : n; });
          if (idx.active === oldName) idx.active = newName;
          saveProfileIndex(idx);
          render();
        });
      });
      document.querySelectorAll("[data-delete-profile]").forEach(function(el){
        el.addEventListener("click", function(){
          var name = el.getAttribute("data-delete-profile");
          if (!confirm('Delete local profile "' + name + '" and everything in it? This cannot be undone.')) return;
          try { localStorage.removeItem(storageKeyForProfile(name)); } catch(e){}
          var idx = loadProfileIndex();
          idx.list = idx.list.filter(function(n){ return n !== name; });
          if (idx.active === name) idx.active = idx.list[0];
          saveProfileIndex(idx);
          state = loadState(); purgeExpiredTrash(); render();
        });
      });
      var addBtn = document.getElementById("addProfileBtn");
      if (addBtn) addBtn.addEventListener("click", function(){
        var name = prompt("New profile name");
        if (!name || !name.trim()) return;
        var idx = loadProfileIndex();
        if (idx.list.indexOf(name) > -1) { showToast("That profile already exists"); return; }
        idx.list.push(name); idx.active = name; saveProfileIndex(idx);
        state = loadState(); currentPage = "dashboard"; render();
      });
    } else {
      document.getElementById("exportBtn").addEventListener("click", function(){
        try {
          var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = "lamcraft-export.json";
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast("Exported");
        } catch(e){ showToast("Export failed in this environment"); }
      });
      document.getElementById("resetBtn").addEventListener("click", function(){
        if (!confirm("Erase all projects, library files and settings for this profile? This cannot be undone.")) return;
        state = defaultState(); saveState(); currentPage = "dashboard"; render();
      });
      document.getElementById("copySourceBtn").addEventListener("click", function(){
        var text = window.__LAMCRAFT_SOURCE__ || "";
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function(){ showToast("Source copied"); }).catch(function(){ showToast("Copy failed"); });
        } else { showToast("Clipboard unavailable in this environment"); }
      });
    }
  }

  /* ============================================================
     TOAST
     ============================================================ */
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  /* ============================================================
     GLOBAL BINDINGS
     ============================================================ */
  document.querySelectorAll(".nav-item").forEach(function(el){ el.addEventListener("click", function(){ go(el.getAttribute("data-page")); }); });
  document.getElementById("newProjectBtn").addEventListener("click", function(){ newProject(); currentPage = "project"; render(); });

  document.getElementById("projectSearchInput").addEventListener("input", function(e){ projectSearch = e.target.value; renderProjectList(); });

  document.getElementById("cadFileInput").addEventListener("change", function(e){ if (e.target.files[0]) handleCadFile(e.target.files[0]); e.target.value = ""; });
  document.getElementById("laminateFileInput").addEventListener("change", function(e){ handleLaminateFiles(e.target.files); e.target.value = ""; });
  document.getElementById("libLaminateFileInput").addEventListener("change", function(e){
    var files = Array.prototype.slice.call(e.target.files);
    var remaining = files.length;
    if (!remaining) return;
    files.forEach(function(file){
      var kind = fileKind(file.name);
      var finalize = function(dataUrl){
        state.library.laminates.push({ id: uid(), name: file.name, kind: kind, size: file.size, uploadedAt: Date.now(), costPerSheet: state.settings.defaultLaminateCostPerSheet, thumbnail: (kind==="image")?dataUrl:null });
        remaining--;
        if (remaining === 0) { saveState(); showToast("Added to library"); render(); }
      };
      if (kind === "image") readFileAsDataURL(file, finalize); else finalize(null);
    });
    e.target.value = "";
  });

  document.getElementById("themeToggle").addEventListener("click", function(){
    var themeOrder = ["auto","light","dark"];
    var cur = document.documentElement.getAttribute("data-theme") || "auto";
    var next = themeOrder[(themeOrder.indexOf(cur) + 1) % themeOrder.length];
    if (next === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", next);
    showToast("Theme: " + next);
  });

  function checkMobile(){
    var isMobile = window.innerWidth <= 760;
    document.getElementById("sidebarToggle").style.display = isMobile ? "inline-block" : "none";
  }
  window.addEventListener("resize", checkMobile);
  checkMobile();
  document.getElementById("sidebarToggle").addEventListener("click", function(){ document.getElementById("sidebar").classList.toggle("open"); });

  /* traffic lights — functional: red = back to dashboard, yellow = minimize sidebar, green = search everything */
  document.getElementById("tlRed").addEventListener("click", function(){ go("dashboard"); });
  document.getElementById("tlYellow").addEventListener("click", function(){ document.getElementById("window").classList.toggle("sidebar-collapsed"); });
  document.getElementById("tlGreen").addEventListener("click", openQuickSearch);

  /* seed a starter project on first run so the app isn't empty */
  if (!Object.keys(state.projects).length) {
    var seedId = newProject();
    state.projects[seedId].name = "Sample — Oak Console Table";
  }
  if (!state.activeProjectId || !state.projects[state.activeProjectId]) {
    state.activeProjectId = Object.keys(state.projects)[0];
  }
  currentPage = "project";
  saveState();
  render();

})();
</script>

</body>
</html>
